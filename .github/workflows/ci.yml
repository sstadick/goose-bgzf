name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.os == 'windows-2025' && 'cl' || 'clang' }}
      CXX: ${{ matrix.os == 'windows-2025' && 'cl' || 'clang++' }}
      GOOSE_CC: ${{ matrix.os == 'windows-2025' && 'clang-cl' || 'clang' }}
      PYTHONUTF8: '1'
      GOOSE_DOC: .ci/goose-doc/main.goose
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aardappel/goose
          ref: 74c641c5ac6d762e57e3177678fe9dea414d042a
          path: .ci/goose
      - uses: actions/checkout@v4
        with:
          repository: sstadick/goose-doc
          ref: bb399143866c0c42268f23c8dfda7a447173f93d
          path: .ci/goose-doc
      - run: |
          cmake -S .ci/goose -B .ci/goose/build -DCMAKE_BUILD_TYPE=Debug -DGOOSE_BUILTIN_LIBS=
          cmake --build .ci/goose/build --config Debug --parallel 2
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "$PWD/.ci/goose/build/Debug" >> "$GITHUB_PATH"
          else
            echo "$PWD/.ci/goose/build" >> "$GITHUB_PATH"
          fi
      - run: scripts/docs.sh --check
      - run: scripts/doctest.sh --cc "$GOOSE_CC"
      - run: python3 tests/run.py
      - name: Generate release API
        if: matrix.os == 'ubuntu-24.04'
        env:
          DOC_OUTPUT: ${{ runner.temp }}/API.md
        run: scripts/docs.sh --source-url "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: api-reference
          path: ${{ runner.temp }}/API.md
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-reference
          path: docs
      - name: Publish tested source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" docs/API.md --verify-tag --generate-notes
